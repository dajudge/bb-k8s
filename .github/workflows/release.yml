name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Validate version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart_version=$(awk '/^version:/ { print $2 }' charts/bb-k8s/Chart.yaml)
          image_tag=$(awk '/^  tag:/ { gsub(/"/, "", $2); print $2 }' charts/bb-k8s/values.yaml)
          test "${version}" = "${chart_version}"
          test "${version}" = "${image_tag}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Verify release inputs
        run: |
          ./scripts/verify-chart.sh
          shellcheck image/*.sh scripts/*.sh

  publish:
    name: Publish image and chart
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            dajudge/bb-k8s:${{ needs.validate.outputs.version }}
            dajudge/bb-k8s:latest
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "dajudge/bb-k8s@${DIGEST}"
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dajudge/bb-k8s@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Package Helm chart
        run: helm package charts/bb-k8s --destination dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.5.0
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/bb-k8s-${{ needs.validate.outputs.version }}.tgz
