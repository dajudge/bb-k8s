name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static and chart checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Verify chart
        run: ./scripts/verify-chart.sh
      - name: Lint shell scripts
        run: shellcheck image/*.sh scripts/*.sh
      - name: Verify dependency licenses
        run: node scripts/verify-licenses.mjs
      - name: Verify npm lockfile
        working-directory: image
        run: npm ci --ignore-scripts --omit=dev

  image-integration:
    name: Image and cluster integration
    runs-on: ubuntu-24.04
    needs: static
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bb-k8s:ci
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=ci
          cache-from: type=gha,scope=integration
          cache-to: type=gha,mode=max,scope=integration
      - name: Smoke-test image
        run: ./scripts/smoke-image.sh bb-k8s:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bb-k8s:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Test chart in kind
        run: ./scripts/integration-kind.sh bb-k8s:ci
      - name: Collect cluster diagnostics
        if: failure()
        run: |
          kubectl --namespace bb-integration describe pod bb-bb-k8s-0 || true
          kubectl --namespace bb-integration logs bb-bb-k8s-0 --all-containers || true

  architectures:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache: amd64
          - platform: linux/arm64
            cache: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=ci
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
